version: '1.0'

services:
  react-app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - VITE_PORT=3004
    volumes:
      - .:/app
    labels:
      - subdomain=te.workbrink.com
      - websiteName=travelease-frontend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
